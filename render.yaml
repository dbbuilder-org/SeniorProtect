# Render Infrastructure as Code
# https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: seniorprotect-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build:shared && npm run build:server
    startCommand: npm run db:migrate && npm run db:seed && node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: seniorprotect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: seniorprotect-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: PHISHTANK_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: seniorprotect-db
    plan: free
    region: oregon
    databaseName: seniorprotect
    postgresMajorVersion: "15"

  - name: seniorprotect-redis
    type: redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
