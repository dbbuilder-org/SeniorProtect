  <!-- S on white half: blue -->
  <text x="355" y="490" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="440" font-weight="900" fill="#1A3A6B">S</text>

  <!-- P on red half: white -->
  <text x="669" y="490" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="440" font-weight="900" fill="#FFFFFF">P</text>
</svg>
