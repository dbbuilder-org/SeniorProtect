<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Shield - left half: white -->
  <path d="M512 80 C512 80 140 180 140 180 L140 500 C140 740 512 960 512 960 L512 80 Z"
        fill="#FFFFFF" stroke="#1A3A6B" stroke-width="8"/>

  <!-- Shield - right half: red -->
  <path d="M512 80 C512 80 884 180 884 180 L884 500 C884 740 512 960 512 960 L512 80 Z"
        fill="#C62828" stroke="#1A3A6B" stroke-width="8"/>

  <!-- Shield outer border (on top) -->
